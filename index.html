<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MadFly Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; }
      #app-canvas { display: block; width: 100vw; height: 100vh; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #e8e0f5; font: 13px 'SF Mono', ui-monospace, monospace;
        background: #0b0614; letter-spacing: 0.1em; z-index: 20;
      }
      #boot.gone { display: none; }
      #log {
        position: fixed; left: 16px; bottom: 16px; z-index: 15;
        color: #e8e0f5; font: 11px 'SF Mono', ui-monospace, monospace;
        background: rgba(18,10,34,.82); border: 1px solid rgba(154,92,255,.35);
        border-radius: 6px; padding: 7px 11px; opacity: 0;
        transition: opacity .35s ease; pointer-events: none;
      }
      #keys {
        position: fixed; left: 16px; top: 16px; z-index: 15;
        color: rgba(232,224,245,.45); font: 10px 'SF Mono', ui-monospace, monospace;
        line-height: 1.7; pointer-events: none;
      }
      #keys b { color: #00e5ff; font-weight: 500; }
      #boot b { color: #00e5ff; font-weight: 500; }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="boot">LOADING <b>REAL CONNECTOME</b> …</div>
    <div id="keys">
      <b>1-4</b> camera &nbsp; <b>R</b> reset &nbsp; <b>N</b> new fly<br>
      <b>P</b> poke &nbsp; <b>L</b> lights &nbsp; <b>B</b> brightness &nbsp; <b>C</b> circuit &nbsp; <b>V</b> brain view &nbsp; <b>shift+G</b> genotype &nbsp; <b>H</b> hide HUD
    </div>
    <div id="log"></div>
    <script type="module">
      import('./examples/hello-lab.js')
        .then(() => document.getElementById('boot').classList.add('gone'))
        .catch((e) => {
          document.getElementById('boot').innerHTML =
            `<div style="max-width:60ch;line-height:1.7">FAILED: ${e.message}<br><br>
             <span style="color:#9a5cff">If the pack is missing, build it:</span><br>
             <code>cd python && uv run python scripts/build_pack.py --all \
             --cache-dir ../../fly_simulation/.cache --out-dir ../packs</code></div>`;
          console.error(e);
        });
    </script>
  </body>
</html>
